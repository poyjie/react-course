<!DOCTYPE html>
<html>

<head>
    <title>ChatBot</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .send-button {
            background-color: rgb(25, 135, 84);
            color: white;
            padding: 12px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }

        .chat-input {
            font-size: 15px;
            padding: 12px 15px;
            border-width: 1px;
            border-radius: 10px;
            margin-right: 10px;
            flex-grow: 1;
        }

        .chat-input-container {
            display: flex;
        }

        .app-container {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-user-message {
            display: flex;
            justify-content: end;
            align-items: start;
        }

        .chat-bot-message {
            display: flex;
            align-items: start;
        }

        .chat-message {
            background-color: rgb(238, 238, 238);
            padding: 15px 20px;
            border-radius: 10px;
            margin-right: 10px;
            margin-left: 10px;
            margin-bottom: 20px;
            max-width: 300px;
        }
        .chat-profile-message{
            width: 45px;
        }
        .chat-messages-container{
            flex-grow: 1;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('');

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            function sendMessage() {
                const newChatMessage = [
                    ...chatMessages,
                    { message: inputText, sender: 'user', id: crypto.randomUUID() },
                ];

                setChatMessages(newChatMessage);
                const loadingId = crypto.randomUUID();
                const response = Chatbot.getResponse(inputText);

                setChatMessages([
                    ...newChatMessage,
                    { message: 'Loading..', sender: 'bot', id: loadingId },
                ]);

                setTimeout(() => {
                    setChatMessages(prevMessages =>
                        prevMessages.map(msg =>
                            msg.id === loadingId
                                ? { ...msg, message: response }
                                : msg
                        )
                    );
                }, 2000);
                setInputText('');
            }

            return (
                <div className="chat-input-container">
                    <input
                        placeholder="Send a message"
                        size="50"
                        onChange={saveInputText}
                        value={inputText}
                        className="chat-input"
                    />
                    <button onClick={sendMessage} className="send-button">Send</button>
                </div>
            );
        }

        function ChatMessage({ message, sender }) {
            return (
                <div className={
                    sender === 'user' ?
                        'chat-user-message' :
                        'chat-bot-message'
                }>

                    {sender === 'bot' && (
                        <img src="assets/robot.png" width="50px" className="chat-profile-message" />
                    )}
                    <div className="chat-message">{message}</div>
                    {sender === 'user' && <img src="assets/user.png" className="chat-profile-message" />}
                </div>
            );
        }

        function ChatMessageList({ chatMessages }) {

            const chatMessageRef = React.useRef(null);    

            React.useEffect(() => {
                const containerElem = chatMessageRef.current;
                if(containerElem){
                    containerElem.scrollTop = containerElem.scrollHeight;
                }
            }, [chatMessages]);

            return (
                <div className="chat-messages-container" ref={chatMessageRef}>
                    {chatMessages.map((chatMessage) => (
                        <ChatMessage key={chatMessage.id} message={chatMessage.message} sender={chatMessage.sender} />
                    ))}
                </div>
            );
        }

        function App() {
            const [chatMessages, setChatMessages] = React.useState([
                { message: 'test', sender: 'user', id: '1' },
                { message: 'test', sender: 'bot', id: '2' }
            ]);

            return (
                <div className="app-container">
                    

                    <ChatMessageList
                        chatMessages={chatMessages}
                    />

                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />
                </div>
            );
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
